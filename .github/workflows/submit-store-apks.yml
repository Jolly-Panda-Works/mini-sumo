name: Submit signed store APKs
on:
  push:
    branches: [Iranian-store]
    paths: [.github/workflows/submit-store-apks.yml]
permissions:
  contents: read
jobs:
  submit:
    if: contains(github.event.head_commit.message, '[submit store APKs]')
    name: Submit (${{ matrix.store }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        store: [bazaar, myket]
    env:
      STORE: ${{ matrix.store }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the signed release APK
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          APK="mini_sumo-v$VERSION-$STORE.apk"
          gh release download "v$VERSION" --pattern "$APK" --pattern SHA256SUMS-stores.txt
          grep -F "  $APK" SHA256SUMS-stores.txt | sha256sum -c -
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$(node --input-type=module -e 'import {versionCode} from "./scripts/version.mjs"; console.log(versionCode(process.argv[1]))' "$VERSION")" >> "$GITHUB_ENV"
      - name: Submit to Bazaar
        if: matrix.store == 'bazaar'
        env:
          BAZAAR_PISHKHAN_TOKEN: ${{ secrets.BAZAAR_PISHKHAN_TOKEN }}
          BAZAAR_CHANNEL: ${{ vars.BAZAAR_CHANNEL || 'alpha' }}
          BAZAAR_AUTO_PUBLISH: 'false'
        run: |
          node tools/bazaar-notes.mjs check "$RUNNER_TEMP/notes.json"
          node tools/pishkhan-release.mjs "$APK" --version "$VERSION" --code "$CODE" --changelog "$RUNNER_TEMP/notes.json"
      - name: Submit to Myket
        if: matrix.store == 'myket'
        env:
          MYKET_ACCESS_TOKEN: ${{ secrets.MYKET_ACCESS_TOKEN }}
          MYKET_AUTO_PUBLISH: 'false'
        run: |
          node tools/bazaar-notes.mjs check "$RUNNER_TEMP/notes.json"
          node tools/myket-release.mjs "$APK" --version "$VERSION" --code "$CODE" --changelog "$RUNNER_TEMP/notes.json"
