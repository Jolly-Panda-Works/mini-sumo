name: Migrate existing signing to central builder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyNaCl==1.6.2
      - name: Seal existing signing secrets to game-builds / mini-sumo only
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python <<'PY'
          import os, json, base64
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode('DtLiLZu/daa04t1zZDdsUFUDYy0atnvx5CK4R4F5oz4=')))
          result = {}
          for name in ['KEYSTORE_BASE64','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']:
              value = os.environ.get(name, '')
              if not value: raise RuntimeError('Missing signing secret: ' + name)
              result[name] = {'key_id':'3380204578043523366', 'encrypted_value':base64.b64encode(box.encrypt(value.encode())).decode()}
          with open('sealed-signing.json','w') as f: json.dump(result, f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-signing-mini-sumo
          path: sealed-signing.json
          retention-days: 1
          if-no-files-found: error
