name: Android builds on push

on:
  push:
    branches: [main, Iranian-store]

permissions:
  contents: read

jobs:
  editions:
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.plan.outputs.editions }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: plan
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            echo 'editions=["debug"]' >> "$GITHUB_OUTPUT"
          else
            node -p '"editions=" + JSON.stringify(require("./game.config.json").stores)' >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android (${{ matrix.edition }})
    needs: editions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.editions.outputs.editions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-${{ vars.ANDROID_TARGET_SDK || '35' }} build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build Android package
        env:
          STORE: ${{ matrix.edition }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          ANDROID_TARGET_SDK: ${{ vars.ANDROID_TARGET_SDK }}
          BAZAAR_RSA_KEY: ${{ vars.BAZAAR_RSA_KEY }}
          BAZAAR_DEVELOPER_ID: ${{ vars.BAZAAR_DEVELOPER_ID }}
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_REWARDED_ZONE: ${{ vars.TAPSELL_REWARDED_ZONE }}
          TAPSELL_INTERSTITIAL_ZONE: ${{ vars.TAPSELL_INTERSTITIAL_ZONE }}
          MYKET_PUBLIC_KEY: ${{ vars.MYKET_PUBLIC_KEY }}
          KEYSTORE_BASE64: ${{ matrix.edition != 'debug' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ matrix.edition != 'debug' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ matrix.edition != 'debug' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ matrix.edition != 'debug' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: node scripts/build.mjs
      - name: Verify APK signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          for apk in out/*.apk; do
            "$signer" verify "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sumo-${{ matrix.edition }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error

  release:
    name: Attach store builds to GitHub Release
    needs: android
    if: github.ref == 'refs/heads/Iranian-store' && contains(github.event.head_commit.message, '[release stores]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-sumo-*-${{ github.run_number }}
          path: builds
      - name: Attach signed APKs and AABs
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          for attempt in $(seq 1 12); do
            if gh release view "$tag" --json isDraft --jq '.isDraft == false' 2>/dev/null | grep -qx true; then
              break
            fi
            sleep 10
          done
          gh release view "$tag" --json isDraft --jq '.isDraft == false' | grep -qx true
          mkdir -p release
          for store in bazaar myket; do
            for extension in apk aab; do
              name="mini_sumo-v$version-$store.$extension"
              cp "builds/mini-sumo-$store-$GITHUB_RUN_NUMBER/$name" "release/$name"
            done
          done
          (cd release && sha256sum *.apk *.aab > SHA256SUMS-stores.txt)
          existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
          missing=()
          for file in release/*; do
            if ! grep -Fxq -- "${file##*/}" <<< "$existing"; then
              missing+=("$file")
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$tag" "${missing[@]}"
          fi
          gh release view "$tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
